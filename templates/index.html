<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard | AI Phishing Detector</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 15, 0.95);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .loading-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .loading-card {
            background: rgba(10, 10, 26, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 32px;
            padding: 40px 60px;
            text-align: center;
            box-shadow: 0 0 60px rgba(0, 243, 255, 0.2);
            animation: glowPulse 1.5s infinite;
        }

        @keyframes glowPulse {
            0% {
                box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            }

            50% {
                box-shadow: 0 0 50px rgba(0, 243, 255, 0.5);
            }

            100% {
                box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            }
        }

        .loading-spinner {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            position: relative;
        }

        .loading-spinner .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #00f3ff;
            animation: spin 1s linear infinite;
        }

        .loading-spinner .ring:nth-child(2) {
            width: 70px;
            height: 70px;
            top: 5px;
            left: 5px;
            border-top-color: #7000ff;
            animation: spin 1.2s linear infinite reverse;
        }

        .loading-spinner .ring:nth-child(3) {
            width: 60px;
            height: 60px;
            top: 10px;
            left: 10px;
            border-top-color: #00ff88;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: #00f3ff;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .loading-steps {
            margin-top: 20px;
        }

        .loading-step {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            color: #8b8bc7;
            font-size: 0.85rem;
            opacity: 0.5;
            transition: all 0.3s ease;
        }

        .loading-step.active {
            opacity: 1;
            color: #00f3ff;
        }

        .loading-step i {
            width: 20px;
        }

        .progress-container {
            width: 300px;
            margin: 25px auto 0;
        }

        .progress-bar-bg {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00f3ff, #7000ff);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .progress-percent {
            margin-top: 8px;
            font-size: 0.7rem;
            color: #00f3ff;
            text-align: right;
        }
    </style>
</head>

<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-card">
            <div class="loading-spinner">
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="ring"></div>
            </div>
            <div class="loading-text" id="loadingText">SCANNING URL</div>

            <div class="loading-steps" id="loadingSteps">
                <div class="loading-step" id="step1">
                    <i class="fas fa-globe"></i> <span>Extracting URL features...</span>
                </div>
                <div class="loading-step" id="step2">
                    <i class="fas fa-chart-line"></i> <span>Calculating distances to K-neighbors...</span>
                </div>
                <div class="loading-step" id="step3">
                    <i class="fas fa-vote-yea"></i> <span>Voting with KNN algorithm...</span>
                </div>
                <div class="loading-step" id="step4">
                    <i class="fas fa-shield-alt"></i> <span>Making final prediction...</span>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-bar-bg">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-percent" id="progressPercent">0%</div>
            </div>
        </div>
    </div>

    <div class="hero">
        <div class="glass-card">
            <div style="text-align: center;">
                <i class="fas fa-shield-halos" style="font-size: 3rem; color: #00f3ff; margin-bottom: 15px;"></i>
                <h1>PhishGuard</h1>
                <p class="subtitle">
                    <i class="fas fa-brain"></i> K-Nearest Neighbors AI |
                    <i class="fas fa-chart-line"></i> Real-time Detection
                </p>
            </div>

            <form id="scanForm" action="/predict" method="POST">
                <div style="position: relative; margin-bottom: 20px;">
                    <i class="fas fa-link"
                        style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #00f3ff;"></i>
                    <input type="text" name="url" class="neon-input" id="urlInput"
                        placeholder="https://example.com/login" style="padding-left: 45px;" required>
                </div>

                <button type="submit" class="neon-btn" id="scanBtn">
                    <i class="fas fa-shield-alt"></i> ANALYZE WITH KNN
                </button>
            </form>

            <div style="margin-top: 25px; text-align: center; font-size: 0.7rem; color: #4a4a7a;">
                <i class="fas fa-database"></i> Dataset: 10k+ URLs |
                <i class="fas fa-chart-simple"></i> K=5 |
                <i class="fas fa-microchip"></i> AI-Powered
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('scanForm');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const loadingText = document.getElementById('loadingText');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');
        const step4 = document.getElementById('step4');

        let currentStep = 0;
        let progress = 0;

        function updateProgress() {
            progressFill.style.width = progress + '%';
            progressPercent.textContent = progress + '%';
        }

        function updateStep(step) {
            const steps = [step1, step2, step3, step4];
            steps.forEach((s, i) => {
                if (i === step - 1) {
                    s.classList.add('active');
                } else {
                    s.classList.remove('active');
                }
            });

            const stepTexts = [
                'EXTRACTING FEATURES',
                'CALCULATING DISTANCES',
                'KNN VOTING',
                'FINAL PREDICTION'
            ];
            loadingText.textContent = stepTexts[step - 1];
        }

        function animateLoading() {
            progress = 0;
            currentStep = 1;
            updateStep(1);

            // Step 1: 0% - 25%
            const step1Interval = setInterval(() => {
                if (progress < 25) {
                    progress += 1;
                    updateProgress();
                } else {
                    clearInterval(step1Interval);
                    currentStep = 2;
                    updateStep(2);

                    // Step 2: 25% - 50%
                    const step2Interval = setInterval(() => {
                        if (progress < 50) {
                            progress += 1;
                            updateProgress();
                        } else {
                            clearInterval(step2Interval);
                            currentStep = 3;
                            updateStep(3);

                            // Step 3: 50% - 75%
                            const step3Interval = setInterval(() => {
                                if (progress < 75) {
                                    progress += 1;
                                    updateProgress();
                                } else {
                                    clearInterval(step3Interval);
                                    currentStep = 4;
                                    updateStep(4);

                                    // Step 4: 75% - 100%
                                    const step4Interval = setInterval(() => {
                                        if (progress < 100) {
                                            progress += 1;
                                            updateProgress();
                                        } else {
                                            clearInterval(step4Interval);
                                            loadingText.textContent = 'REDIRECTING...';
                                        }
                                    }, 20);
                                }
                            }, 25);
                        }
                    }, 25);
                }
            }, 25);
        }

        form.addEventListener('submit', function (e) {
            const urlInput = document.getElementById('urlInput');
            if (!urlInput.value.trim()) {
                e.preventDefault();
                return;
            }

            e.preventDefault();

            // Reset dan tampilkan loading
            progress = 0;
            updateProgress();
            loadingOverlay.classList.add('active');
            animateLoading();

            // Submit form setelah loading selesai (1.5 detik)
            setTimeout(() => {
                form.submit();
            }, 2500);
        });
    </script>
</body>

</html>
